<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEON RUSH – מרוץ סייברפאנק</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Heebo:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07020f;--panel:rgba(10,3,26,.94);--cy:#19f6ff;--mg:#ff2bd6;--yl:#ffe600;--tx:#e8e4ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,#1a0838,var(--bg) 70%);display:flex;align-items:center;justify-content:center;font-family:'Heebo',sans-serif;color:var(--tx);overflow:hidden;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:min(96vh,800px);aspect-ratio:2/3;max-width:100vw;border:2px solid var(--mg);box-shadow:0 0 24px var(--mg),0 0 60px rgba(25,246,255,.35),inset 0 0 20px rgba(25,246,255,.25)}
canvas#c{width:100%;height:100%;image-rendering:pixelated;display:block;background:#0a0418}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.scr{position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;align-items:center;padding:4% 4% 3%;overflow:auto;z-index:2;text-align:center}
.scr.on{display:flex}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(18px,5.4vw,30px);margin:.2em 0 .3em;color:#fff;text-shadow:3px 3px 0 var(--mg),-3px -3px 0 var(--cy),0 0 18px var(--mg)}
.sub{color:var(--cy);font-weight:800;letter-spacing:.05em;margin-bottom:10px;font-size:14px}
.px{font-family:'Press Start 2P',monospace}
#rank{display:flex;align-items:center;gap:12px;background:#120633;border:2px solid #3a1c7a;padding:8px 12px;width:92%;margin-bottom:12px}
.badge{width:44px;height:50px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none;display:grid;place-items:center;font-size:11px;color:#000;font-weight:800}
.rinfo{flex:1;text-align:right}
.rname{font-family:'Press Start 2P',monospace;font-size:12px;margin-bottom:6px}
.bar{height:10px;background:#07020f;border:1px solid #3a1c7a}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg))}
.rtxt{font-size:12px;opacity:.8;margin-top:4px}
#cards{display:flex;gap:8px;width:100%;margin:6px 0 14px}
.card{flex:1;background:#120633;border:2px solid #3a1c7a;padding:8px 4px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px)}
.card.sel{border-color:var(--cc);box-shadow:0 0 16px var(--cc),inset 0 0 12px rgba(255,255,255,.08);background:#1c0a45}
.card canvas{width:60px;height:84px;image-rendering:pixelated}
.cn{font-family:'Press Start 2P',monospace;font-size:9px;margin:6px 0 2px;color:var(--cc)}
.ch{font-size:12px;opacity:.85;margin-bottom:6px}
.st{display:flex;align-items:center;gap:4px;font-size:10px;margin:3px 6px}
.st span{width:44px;text-align:right}.st .bar{flex:1;height:6px}.st .bar i{background:var(--cc)}
.btn{font-family:'Press Start 2P',monospace;font-size:12px;color:#000;background:var(--yl);border:0;padding:14px 18px;cursor:pointer;box-shadow:4px 4px 0 var(--mg);margin:4px}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--mg)}
.btn.alt{background:var(--cy)}
.help{font-size:12px;opacity:.75;margin-top:10px;line-height:1.6}
#big{font-family:'Press Start 2P',monospace;font-size:clamp(22px,7vw,38px);margin:14px 0 6px}
.pts{font-family:'Press Start 2P',monospace;font-size:20px;color:var(--yl);text-shadow:0 0 14px var(--yl);margin:8px 0}
#up{display:none;font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.7;padding:10px;border:2px dashed currentColor;margin:10px 0;animation:bl .6s infinite alternate}
@keyframes bl{to{opacity:.4}}
#tc{position:absolute;bottom:10px;left:0;right:0;display:none;justify-content:space-between;padding:0 10px;z-index:3}
#tc.on{display:flex}
#tc button{width:70px;height:70px;font-size:26px;background:rgba(25,246,255,.18);border:2px solid var(--cy);color:#fff;touch-action:none}
#tc button.n{border-color:var(--mg);background:rgba(255,43,214,.2);font-size:11px;font-family:'Press Start 2P',monospace}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="320" height="480"></canvas>

<div id="menu" class="scr on">
  <h1>NEON RUSH</h1>
  <div class="sub">מרוץ הרחובות של 2099</div>
  <div id="rank"></div>
  <div style="font-weight:800;margin-bottom:4px">בחר מכונית מרוץ</div>
  <div id="cards"></div>
  <button class="btn" id="go">START RACE</button>
  <div class="help">חצים / A D להיגוי · SPACE או SHIFT לנייטרו · חץ למטה לבלימה<br>נצחון = 100 נקודות · כל 300 נקודות = דרגה חדשה</div>
</div>

<div id="res" class="scr">
  <h1>RESULT</h1>
  <div id="big"></div>
  <div id="rt" style="opacity:.8"></div>
  <div class="pts" id="pg"></div>
  <div id="up"></div>
  <div id="rank2" style="width:100%;display:flex;justify-content:center"></div>
  <div style="margin-top:14px"><button class="btn" id="again">מרוץ נוסף</button><button class="btn alt" id="chg">החלף רכב</button></div>
</div>

<div id="tc"><div><button id="bl">◀</button> <button id="br">▶</button></div><button class="n" id="bn">NITRO</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const RANKS=[{n:'BRONZE',h:'ברונזה',c:'#cd7f32'},{n:'SILVER',h:'כסף',c:'#c9d1e6'},{n:'GOLD',h:'זהב',c:'#ffd700'},{n:'PLATINUM',h:'פלטינה',c:'#5ff3e6'},{n:'DIAMOND',h:'יהלום',c:'#6ab8ff'}];
const TYPES=[
 {n:'VIPER',h:'מהירות שיא',col:'#ff2bd6',max:300,acc:1.0,hnd:.85,t:0},
 {n:'PHANTOM',h:'מאוזנת',col:'#19f6ff',max:285,acc:1.25,hnd:1.0,t:1},
 {n:'DRIFTER',h:'זריזה ואגרסיבית',col:'#ffe600',max:268,acc:1.6,hnd:1.3,t:2}];
const AICOL=['#ff6a1a','#ff2d4d','#39ff6a','#b07bff'];
const LEN=9000, RL=60, RR=260;
let pts=0;try{pts=+localStorage.getItem('nr_pts')||0}catch(e){}
const rIdx=p=>Math.min(4,Math.floor(p/300));
const save=()=>{try{localStorage.setItem('nr_pts',pts)}catch(e){}};
let sel=1,state='menu',cars=[],P=null,cd=0,t0=0,fin=[],endT=0,shake=0,last=0;
const keys={l:0,r:0,d:0,n:0};

/* ---------- drawing ---------- */
function drawCar(c,cx,cy,t,col,fire){
 const x=Math.round(cx-10),y=Math.round(cy-17);
 if(fire){c.fillStyle='#ff8a00';c.fillRect(x+4,y+34,5,6+Math.random()*8);c.fillRect(x+11,y+34,5,6+Math.random()*8);c.fillStyle='#fff3a0';c.fillRect(x+5,y+34,3,4);c.fillRect(x+12,y+34,3,4)}
 c.globalAlpha=.28;c.fillStyle=col;c.fillRect(x-4,y+1,28,36);c.globalAlpha=1;
 c.fillStyle='#0b0b14';[5,22].forEach(o=>{c.fillRect(x-2,y+o,4,9);c.fillRect(x+18,y+o,4,9)});
 c.fillStyle=col;c.fillRect(x+2,y+2,16,30);c.fillRect(x+5,y,10,3);
 c.fillStyle='rgba(0,0,0,.35)';c.fillRect(x+2,y+2,3,30);c.fillRect(x+15,y+2,3,30);
 c.fillStyle='#fff';c.fillRect(x+9,y+3,2,8);
 c.fillStyle='#0b1030';c.fillRect(x+5,y+12,10,9);c.fillStyle='#6ff';c.fillRect(x+6,y+13,3,2);
 c.fillStyle='#e8e4ff';
 if(t==0)c.fillRect(x-2,y+30,24,3);else if(t==1)c.fillRect(x,y+30,20,3);else c.fillRect(x+3,y+31,14,2);
 c.fillStyle='#fff';c.fillRect(x+3,y+1,3,2);c.fillRect(x+14,y+1,3,2);
 c.fillStyle='#ff2020';c.fillRect(x+3,y+32,4,2);c.fillRect(x+13,y+32,4,2);
}
const hash=(a,b)=>{let h=(a*73856093^b*19349663)>>>0;h=(h^(h>>>13))*1274126177>>>0;return (h%1000)/1000};
const NEON=['#19f6ff','#ff2bd6','#ffe600','#7cff3a','#ff6a1a'];
function sides(pos){
 g.fillStyle='#0d0524';g.fillRect(0,0,RL,480);g.fillRect(RR,0,60,480);
 const k0=Math.floor((pos-120)/50);
 for(let k=k0;k<k0+12;k++){const y=Math.round(360-(k*50-pos))-46;
  for(let s=0;s<2;s++){const h=hash(k,s),w=14+Math.floor(h*38),bx=s?320-w:0,nc=NEON[Math.floor(h*50)%5];
   g.fillStyle='#160a33';g.fillRect(bx,y,w,46);
   g.fillStyle=nc;g.fillRect(s?bx:w-2,y,2,46);g.fillRect(bx,y,w,2);
   for(let wy=6;wy<42;wy+=8)for(let wx=4;wx<w-8;wx+=8){const q=hash(k*131+wy*7+wx,s+5);
    if(q>.5){g.globalAlpha=.9;g.fillStyle=q>.8?'#fff':NEON[Math.floor(q*20)%5];g.fillRect(bx+wx+(s?4:0),y+wy,4,4);g.globalAlpha=1}}}}
}
function checker(y){for(let r=0;r<2;r++)for(let i=0;i<20;i++){g.fillStyle=(i+r)%2?'#fff':'#111';g.fillRect(RL+i*10,y+r*10,10,10)}}
function render(){
 const p=P;if(!p)return;
 g.save();if(shake>0)g.translate((Math.random()-.5)*5,(Math.random()-.5)*5);
 g.fillStyle='#0a0418';g.fillRect(-10,-10,340,500);
 sides(p.pos);
 g.fillStyle='#161030';g.fillRect(RL,0,RR-RL,480);
 g.fillStyle='rgba(25,246,255,.07)';g.fillRect(RL,0,RR-RL,480);
 const o32=((p.pos%32)+32)%32,o40=((p.pos%40)+40)%40;
 for(let i=-2;i<17;i++){const y=Math.round(i*32+o32);
  g.fillStyle='#19f6ff';g.fillRect(RL-3,y,5,16);g.fillRect(RR-2,y,5,16);
  g.fillStyle='#ff2bd6';g.fillRect(RL-3,y+16,5,16);g.fillRect(RR-2,y+16,5,16)}
 g.fillStyle='rgba(120,90,255,.75)';
 for(let i=-1;i<13;i++){const y=Math.round(i*40+o40);[100,140,180,220].forEach(x=>g.fillRect(x-1,y,2,20))}
 const sy=360+p.pos;if(sy<500){checker(sy-10)}
 const fy=360-(LEN-p.pos);if(fy>-40&&fy<520){checker(Math.round(fy)-10);g.fillStyle='#ffe600';g.fillRect(RL-3,fy-30,3,50);g.fillRect(RR,fy-30,3,50);g.fillRect(RL,fy-32,RR-RL,4);g.fillStyle='#ff2bd6';g.fillRect(RL,fy-28,RR-RL,2)}
 if(p.fire&&state=='race'){g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<10;i++)g.fillRect(RL+6+Math.random()*(RR-RL-12),Math.random()*480,1,18+Math.random()*30)}
 [...cars].sort((a,b)=>b.pos-a.pos).forEach(c=>{const y=360-(c.pos-p.pos);if(y>-40&&y<530)drawCar(g,c.x,y,c.t,c.col,c.fire)});
 g.restore();
 // HUD
 g.font='8px "Press Start 2P",monospace';
 const place=1+cars.filter(c=>c!==p&&(c.fin?fin.indexOf(c)<(p.fin?fin.indexOf(p):99):c.pos>p.pos)).length;
 g.fillStyle='#000a';g.fillRect(6,6,86,18);g.fillStyle='#ffe600';g.fillText('POS '+(p.fin?fin.indexOf(p)+1:place)+'/5',12,19);
 g.fillStyle='#000a';g.fillRect(6,456,112,18);g.fillStyle='#19f6ff';g.fillText('NITRO',10,468);
 g.fillStyle='#07020f';g.fillRect(52,459,62,10);g.fillStyle=p.nitro<25?'#ff2d4d':'#ff2bd6';g.fillRect(53,460,60*p.nitro/100,8);
 g.fillStyle='#000a';g.fillRect(222,456,92,18);g.fillStyle='#fff';g.fillText(Math.round(p.v*.6)+' KM/H',228,468);
 g.fillStyle='#000a';g.fillRect(308,36,6,404);
 cars.forEach(c=>{g.fillStyle=c===p?'#fff':c.col;const y=436-Math.min(1,c.pos/LEN)*396;g.fillRect(c===p?306:308,y,c===p?10:6,c===p?6:4)});
 if(state=='cd'){g.textAlign='center';g.font='40px "Press Start 2P",monospace';const n=Math.ceil(cd-.6);
  g.fillStyle='#ff2bd6';g.fillText(n>0?n:'GO!',163,243);g.fillStyle='#19f6ff';g.fillText(n>0?n:'GO!',160,240);g.textAlign='left'}
 else if(state=='race'&&cd>-.6){g.textAlign='center';g.font='40px "Press Start 2P",monospace';g.fillStyle='#7cff3a';g.fillText('GO!',160,240);g.textAlign='left'}
}

/* ---------- game logic ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function start(){
 const lanes=[80,120,160,200,240].sort(()=>Math.random()-.5),T=TYPES[sel];
 P={...T,p:1,x:lanes[0],pos:0,v:0,nitro:100,fire:0,hit:0,fin:0};
 cars=[P];fin=[];
 for(let i=0;i<4;i++)cars.push({p:0,t:i%3,col:AICOL[i],x:lanes[i+1],pos:0,v:0,max:266+Math.random()*28,acc:1.35,hnd:1.1,tx:lanes[i+1],tt:0,nt:3+Math.random()*5,nOn:0,hit:0,fin:0,fire:0});
 cd=3.6;t0=0;endT=0;state='cd';
 $('menu').classList.remove('on');$('res').classList.remove('on');$('tc').classList.add('on');
}
function step(dt){
 if(state=='cd'){cd-=dt;if(cd<=.6){state='race'}return}
 if(cd>-.6)cd-=dt;
 t0+=dt;shake=Math.max(0,shake-dt);
 for(const c of cars){
  let dir=0,nit=false,brake=false;
  c.hit=Math.max(0,c.hit-dt);
  if(c.p){dir=keys.r-keys.l;brake=!!keys.d;nit=keys.n&&c.nitro>0&&c.v>80;
   c.nitro=nit?Math.max(0,c.nitro-34*dt):Math.min(100,c.nitro+6*dt)}
  else{
   c.tt-=dt;
   if(c.tt<=0){c.tt=.5+Math.random()*.8;
    const b=cars.find(o=>o!==c&&o.pos>c.pos&&o.pos-c.pos<120&&Math.abs(o.x-c.x)<28);
    if(b){c.tx=b.x>c.x?c.x-44:c.x+44}
    else if(c.pos>P.pos-30&&c.pos-P.pos<170&&Math.random()<.45)c.tx=P.x;
    else if(Math.random()<.3)c.tx=80+Math.floor(Math.random()*5)*40;
    c.tx=clamp(c.tx,82,238)}
   c.nt-=dt;if(c.nt<=0){c.nOn=1.2;c.nt=6+Math.random()*5}
   c.nOn=Math.max(0,c.nOn-dt);nit=c.nOn>0;
   const dx=c.tx-c.x,m=c.hnd*95*dt;c.x+=clamp(dx,-m,m)}
  c.fire=nit;
  const off=c.x<76||c.x>244;
  let mx=c.max*(nit?1.3:1)*(off?.6:1);
  if(!c.p)mx*=1+clamp((P.pos-c.pos)/2000,-.03,.07);
  c.v+=(mx-c.v)*Math.min(1,c.acc*dt*.9);
  if(brake)c.v=Math.max(0,c.v-380*dt);
  if(c.p)c.x+=dir*c.hnd*125*dt*(.45+.55*Math.min(1,c.v/160));
  c.x=clamp(c.x,66,254);
  c.pos+=c.v*dt;
  if(!c.fin&&c.pos>=LEN){c.fin=1;c.t=t0;fin.push(c);if(c.p)endT=1.3}
 }
 for(let i=0;i<5;i++)for(let j=i+1;j<5;j++){
  const a=cars[i],b=cars[j],dy=b.pos-a.pos,dx=b.x-a.x;
  if(Math.abs(dy)<32&&Math.abs(dx)<19){
   const rear=dy>0?a:b,front=dy>0?b:a;
   if(Math.abs(dy)>Math.abs(dx)*1.3){
    rear.pos=front.pos-32;
    if(!rear.hit){rear.v*=.7;front.v=Math.min(front.max*1.15,front.v*1.04);rear.hit=.4;if(rear.p||front.p)shake=.2}
   }else{
    const o=(19-Math.abs(dx))/2,s=dx>=0?1:-1;a.x-=s*o;b.x+=s*o;a.v*=.985;b.v*=.985;
    if(!a.hit&&(a.p||b.p)){shake=.12;a.hit=b.hit=.2}}}}
 if(endT>0){endT-=dt;if(endT<=0)finish()}
}
function badge(r,sz){return `<div class="badge" style="background:${r.c};box-shadow:0 0 14px ${r.c};width:${sz}px;height:${sz*1.14}px"></div>`}
function rankHTML(){
 const i=rIdx(pts),r=RANKS[i],prog=i<4?(pts%300)/300:1;
 return `${badge(r,44)}<div class="rinfo"><div class="rname" style="color:${r.c}">${r.n} · ${r.h}</div><div class="bar"><i style="width:${prog*100}%"></i></div><div class="rtxt">${i<4?`${pts%300}/300 לדרגה ${RANKS[i+1].h} · סה"כ ${pts}`:`דרגה מקסימלית! · סה"כ ${pts} נקודות`}</div></div>`}
function finish(){
 state='res';$('tc').classList.remove('on');
 const place=fin.indexOf(P)+1,old=rIdx(pts),won=place==1;
 if(won){pts+=100;save()}
 const nw=rIdx(pts);
 $('big').textContent=won?'VICTORY!':'מקום '+place+' מתוך 5';
 $('big').style.color=won?'#7cff3a':place<=3?'#19f6ff':'#ff2d4d';
 $('rt').textContent='זמן: '+P.t.toFixed(2)+' שניות';
 $('pg').textContent=won?'+100 נקודות':'ללא נקודות – רק מקום ראשון מנצח';
 $('pg').style.color=won?'#ffe600':'#8a80b0';
 const up=$('up');
 if(nw>old){up.style.display='block';up.style.color=RANKS[nw].c;up.innerHTML=`RANK UP!<br>עלית לדרגת ${RANKS[nw].h} · ${RANKS[nw].n}`}else up.style.display='none';
 $('rank2').innerHTML=`<div id="rank" style="margin:0">${rankHTML()}</div>`;
 $('res').classList.add('on');
}
function menu(){
 state='menu';$('res').classList.remove('on');$('tc').classList.remove('on');$('menu').classList.add('on');
 $('rank').innerHTML=rankHTML();
 const box=$('cards');box.innerHTML='';
 TYPES.forEach((T,i)=>{
  const d=document.createElement('div');d.className='card'+(i==sel?' sel':'');d.style.setProperty('--cc',T.col);
  d.innerHTML=`<canvas width="30" height="42"></canvas><div class="cn">${T.n}</div><div class="ch">${T.h}</div>
   <div class="st"><span>מהירות</span><div class="bar"><i style="width:${(T.max-200)/1}%"></i></div></div>
   <div class="st"><span>תאוצה</span><div class="bar"><i style="width:${T.acc/1.6*100}%"></i></div></div>
   <div class="st"><span>שליטה</span><div class="bar"><i style="width:${T.hnd/1.3*100}%"></i></div></div>`;
  const c=d.querySelector('canvas').getContext('2d');drawCar(c,15,21,T.t,T.col,0);
  d.onclick=()=>{sel=i;menu()};box.appendChild(d)});
}
function loop(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(state=='cd'||state=='race')step(dt);
 if(state=='cd'||state=='race')render();
 requestAnimationFrame(loop)}

/* ---------- input ---------- */
const map={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowDown:'d',s:'d',S:'d',' ':'n',Shift:'n',ArrowUp:'n',w:'n',W:'n'};
addEventListener('keydown',e=>{const k=map[e.key];if(k){keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=map[e.key];if(k)keys[k]=0});
[['bl','l'],['br','r'],['bn','n']].forEach(([id,k])=>{const b=$(id);
 b.addEventListener('pointerdown',e=>{keys[k]=1;e.preventDefault()});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
$('go').onclick=start;$('again').onclick=start;$('chg').onclick=menu;
if(!matchMedia('(pointer:coarse)').matches)$('tc').style.display='none';
menu();requestAnimationFrame(loop);
</script>
</body>
</html>
